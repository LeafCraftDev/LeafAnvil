plugins {
    id 'net.fabricmc.fabric-loom'
}

group = 'net.leaf'
version = '0.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'

    implementation project(':resource:LeafAnvil:leafanvil-common')
    implementation(project(':fabric:fabric-common-unobf')) { transitive = false }
    implementation 'net.fabricmc:fabric-loader:0.18.4'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.143.5+26.1'
    compileOnly 'com.mojang:brigadier:1.3.10'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
    jacoco {
        enabled = false
    }
}

tasks.matching { it.name.startsWith('jacoco') }.configureEach {
    enabled = false
}
