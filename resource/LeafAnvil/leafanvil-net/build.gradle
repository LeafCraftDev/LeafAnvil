// LeafAnvil-Net - free MIT-licensed multi-loader server TX + client RX mod/plugin
// (Paper/Folia, Fabric, NeoForge) for negotiated LCA_NET_V1 chunk streaming, revisit delta
// caching, and live RAM section compaction without on-disk .lca conversion (leafanvil-ADR-003).
plugins {
    id 'java-library'
    id 'com.gradleup.shadow'
}

group = 'net.leaf'
version = '0.3.0'

base {
    archivesName = 'LeafAnvil-Net'
}

def hasJdk25Carriers = findProject(':resource:LeafAnvil:leafanvil-fabric') != null ||
        findProject(':resource:LeafAnvil:leafanvil-neoforge') != null

java {
    if (hasJdk25Carriers) {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    } else {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

dependencies {
    implementation(project(':resource:LeafAnvil:leafanvil-common')) { transitive = false }
    api(project(':resource:LeafAnvil:leafanvil-paper')) { transitive = false }
    implementation project(':anvil-api')
    implementation project(':bit-api')
    implementation project(':server-api')

    if (findProject(':resource:LeafAnvil:leafanvil-fabric') != null) {
        api(project(':resource:LeafAnvil:leafanvil-fabric')) { transitive = false }
    }
    if (findProject(':resource:LeafAnvil:leafanvil-neoforge') != null) {
        api(project(':resource:LeafAnvil:leafanvil-neoforge')) { transitive = false }
    }
}

processResources {
    from("${rootProject.projectDir}") {
        include 'LICENSE-MIT'
        into 'META-INF/leafanvil-net'
    }
    from("${rootProject.projectDir}/api/anvil-api/docs") {
        include 'ICD.md'
        into 'META-INF/leafanvil-net'
    }
}

shadowJar {
    archiveBaseName.set('LeafAnvil-Net')
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    relocate 'io.github.dailystruggle', 'net.leaf.anvil.shaded.io.github.dailystruggle'
    // while retaining the full LCA_NET_V1 server TX + client RX wire streaming and RAM section compaction path
    exclude 'net/leaf/anvil/common/NmsRegionStorageInterceptor*.class'
    exclude 'net/leaf/anvil/common/LeafAnvilWorldConverter*.class'
    exclude 'net/leaf/anvil/common/command/**'
    exclude 'net/leaf/anvil/neoforge/NeoForgeLeafAnvilMod$ServerEntrypoint.class'

    // Exclude commercial license and server-only disk mixin descriptor from upstream subprojects
    exclude 'META-INF/leafanvil/**'
    exclude 'docs/admin/**'
    exclude 'leafanvil.mixins.json'
    exclude 'org/jetbrains/annotations/**'
    exclude 'org/intellij/lang/annotations/**'
    exclude 'META-INF/maven/**'
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'
}

tasks.named('jar') { enabled = false }
assemble.dependsOn shadowJar

tasks.register('generateChecksums') {
    group = 'build'
    description = 'Generates SHA-256 and SHA-512 checksums for LeafAnvil-Net release deliverables (ADR-126).'
    dependsOn tasks.named('shadowJar')

    doLast {
        File jarFile = tasks.named('shadowJar').get().archiveFile.get().asFile
        if (jarFile.exists()) {
            ['SHA-256': '.sha256', 'SHA-512': '.sha512'].each { algo, ext ->
                def digest = java.security.MessageDigest.getInstance(algo)
                jarFile.withInputStream { is ->
                    byte[] buffer = new byte[8192]
                    int read
                    while ((read = is.read(buffer)) > 0) {
                        digest.update(buffer, 0, read)
                    }
                }
                def hex = digest.digest().collect { String.format('%02x', it) }.join('')
                def checksumFile = new File(jarFile.parentFile, jarFile.name + ext)
                checksumFile.text = "${hex}  ${jarFile.name}\n"
                logger.lifecycle("[ADR-126] Generated ${algo} checksum for ${jarFile.name} -> ${checksumFile.name}")
            }
        }
    }
}

apply plugin: 'signing'

signing {
    def signingKey = findProperty('signingKey') as String
    def signingPassword = findProperty('signingPassword') as String
    if (findProperty('signWithGpgCmd') != null) {
        useGpgCmd()
    } else if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
}

tasks.register('signDeliverables') {
    group = 'signing'
    description = 'Signs the LeafAnvil-Net shaded release deliverable if signing keys are present (ADR-126).'
    dependsOn tasks.named('shadowJar')

    doLast {
        def signingKey = findProperty('signingKey') as String
        def useGpg = findProperty('signWithGpgCmd') != null
        if (!signingKey && !useGpg) {
            logger.info('[ADR-126] Skipping signDeliverables: no signing credentials configured.')
            return
        }

        File jarFile = tasks.named('shadowJar').get().archiveFile.get().asFile
        if (jarFile.exists()) {
            try {
                project.signing.sign(jarFile)
                logger.lifecycle("[ADR-126] Signed deliverable: ${jarFile.name}")
            } catch (Exception e) {
                logger.warn("[ADR-126] Failed to sign deliverable ${jarFile.name}: ${e.message}")
                if (project.hasProperty('strictSigning')) {
                    throw e
                }
            }
        }
    }
}

assemble.dependsOn tasks.named('generateChecksums')

test {
    dependsOn shadowJar
    useJUnitPlatform()
    systemProperty 'leafanvil.net.jar.path', shadowJar.archiveFile.get().asFile.absolutePath
    jacoco {
        enabled = false
    }
}

tasks.matching { it.name.startsWith('jacoco') }.configureEach {
    enabled = false
}
